<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Challenge Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --border: #2a2a2a;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --red: #e63946;
    --orange: #ff9800;
    --yellow: #ffd60a;
    --lightblue: #29b6f6;
    --green: #4caf50;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 4px 0 2px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hint {
    font-size: 0.72rem;
    color: var(--muted);
    margin: -8px 0 10px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f0f0f;
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--red);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .summary div { text-align: center; flex: 1; min-width: 70px; }
  .summary .num { font-size: 1.2rem; font-weight: 700; }
  .summary .lbl { font-size: 0.72rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; }
  .bar-bg {
    background: #2a2a2a;
    border-radius: 6px;
    height: 8px;
    width: 100%;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar-fill { height: 100%; }
  .invest-line {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-nav button { width: auto; padding: 6px 14px; }
  .month-label { font-weight: 600; }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .edit-btn {
    cursor: pointer;
    margin-left: 4px;
    font-size: 0.85em;
    opacity: 0.75;
  }
  .edit-btn:hover { opacity: 1; }
  .row-edit input {
    margin-bottom: 6px;
  }
  .row-edit .actions { display: flex; gap: 6px; }
  .row-edit .actions button {
    width: auto;
    padding: 8px 14px;
    font-size: 0.82rem;
  }
  .loading-row {
    text-align: center;
    color: var(--muted);
    padding: 18px 0 !important;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Challenge Tracker</h1>
  <div class="sub">บันทึกชาเลนจ์รายวัน แยกชีทอัตโนมัติเป็นรายเดือน</div>

  <div class="card">
    <details id="settingsBox">
      <summary>⚙️ ตั้งค่า (ทำครั้งแรกครั้งเดียว)</summary>
      <div style="margin-top:12px;">
        <label>Apps Script Web App URL</label>
        <input id="scriptUrl" placeholder="https://script.google.com/macros/s/xxxx/exec">
        <label>เป้าหมายต่อวัน (บาท)</label>
        <input id="dailyTarget" type="number" value="3000">
        <button class="secondary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      </div>
    </details>
  </div>

  <div class="card">
    <label>วันที่</label>
    <input id="entryDate" type="date">

    <label>เพิ่ม/ลดยอดวันนี้ (บาท)</label>
    <input id="entryAmount" type="number" placeholder="เช่น 500 หรือ -500 ถ้าขาดทุน">
    <div class="hint">ใส่กี่ครั้งก็ได้ในวันเดียว ระบบจะบวกสะสมให้เอง ใส่ติดลบได้ถ้าขาดทุน</div>

    <label>ยอดลงทุนวันนี้ (บาท) — ไม่บังคับ</label>
    <input id="entryInvestment" type="number" placeholder="0">

    <button onclick="submitEntry()">บันทึก</button>
  </div>

  <div class="card">
    <div class="month-nav">
      <button class="secondary" onclick="changeMonth(-1)">‹ เดือนก่อน</button>
      <div class="month-label" id="monthLabel">-</div>
      <button class="secondary" onclick="changeMonth(1)">เดือนถัดไป ›</button>
    </div>

    <div class="summary">
      <div><div class="num" id="sumDays">0</div><div class="lbl">วันที่บันทึก</div></div>
      <div><div class="num" id="sumTotal">0</div><div class="lbl">ยอดรวม (บาท)</div></div>
      <div><div class="num" id="sumAvgPct">0%</div><div class="lbl">เฉลี่ย/เป้าหมาย</div></div>
      <div><div class="num" id="sumInvest">0</div><div class="lbl">ลงทุนรวม (บาท)</div></div>
    </div>

    <table>
      <thead>
        <tr><th>วันที่</th><th>ทำได้ / เป้าหมาย</th><th style="width:60px;">%</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="legend">
      <span><span class="dot" style="background:var(--red)"></span>0%</span>
      <span><span class="dot" style="background:var(--orange)"></span>1-45%</span>
      <span><span class="dot" style="background:var(--yellow)"></span>46-69%</span>
      <span><span class="dot" style="background:var(--lightblue)"></span>70-99%</span>
      <span><span class="dot" style="background:var(--green)"></span>100%+</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
function pad2_(n) { return String(n).padStart(2, "0"); }
function localDateStr_(d) { return d.getFullYear() + "-" + pad2_(d.getMonth() + 1) + "-" + pad2_(d.getDate()); }
function localMonthStr_(d) { return d.getFullYear() + "-" + pad2_(d.getMonth() + 1); }

let currentMonth = localMonthStr_(new Date());
let currentRows = [];
let editingDate = null;

function getScriptUrl() { return localStorage.getItem("scriptUrl") || ""; }
function getDailyTarget() { return Number(localStorage.getItem("dailyTarget")) || 3000; }

function saveSettings() {
  const url = document.getElementById("scriptUrl").value.trim();
  const target = document.getElementById("dailyTarget").value;
  localStorage.setItem("scriptUrl", url);
  localStorage.setItem("dailyTarget", target);
  showToast("บันทึกการตั้งค่าแล้ว");
  document.getElementById("settingsBox").removeAttribute("open");
  loadMonth();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function initSettingsFields() {
  document.getElementById("scriptUrl").value = getScriptUrl();
  document.getElementById("dailyTarget").value = getDailyTarget();
  document.getElementById("entryDate").value = localDateStr_(new Date());
  if (!getScriptUrl()) {
    document.getElementById("settingsBox").setAttribute("open", "true");
  }
}

function percentColor(pct) {
  if (pct <= 0) return "var(--red)";
  if (pct <= 45) return "var(--orange)";
  if (pct <= 69) return "var(--yellow)";
  if (pct <= 99) return "var(--lightblue)";
  return "var(--green)";
}

async function submitEntry() {
  const url = getScriptUrl();
  if (!url) { showToast("กรุณาตั้งค่า Script URL ก่อน"); return; }
  const date = document.getElementById("entryDate").value;
  const amount = document.getElementById("entryAmount").value;
  const investment = document.getElementById("entryInvestment").value;
  if (!date || amount === "") { showToast("กรอกวันที่และยอดให้ครบ"); return; }

  try {
    await fetch(url, {
      method: "POST",
      body: JSON.stringify({
        date,
        target: getDailyTarget(),
        achieved: amount,
        investment: investment || 0
      })
    });
    showToast("บันทึกแล้ว ✅");
    document.getElementById("entryAmount").value = "";
    document.getElementById("entryInvestment").value = "";
    currentMonth = date.slice(0, 7);
    loadMonth();
  } catch (err) {
    showToast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
  }
}

function changeMonth(delta) {
  let [y, m] = currentMonth.split("-").map(Number);
  m += delta;
  if (m < 1) { m = 12; y -= 1; }
  if (m > 12) { m = 1; y += 1; }
  currentMonth = y + "-" + pad2_(m);
  loadMonth();
}

function setLoading(isLoading) {
  document.querySelectorAll(".month-nav button").forEach(b => b.disabled = isLoading);
  if (isLoading) {
    document.getElementById("tableBody").innerHTML =
      "<tr><td colspan='3' class='loading-row'>⏳ กำลังโหลดข้อมูล...</td></tr>";
  }
}

async function loadMonth() {
  document.getElementById("monthLabel").textContent = currentMonth;
  const url = getScriptUrl();
  if (!url) return;

  editingDate = null;
  setLoading(true);
  try {
    const res = await fetch(`${url}?month=${currentMonth}`);
    const data = await res.json();
    currentRows = data.rows || [];
    renderTable();
  } catch (err) {
    document.getElementById("tableBody").innerHTML = "<tr><td colspan='3'>โหลดข้อมูลไม่สำเร็จ</td></tr>";
  } finally {
    setLoading(false);
  }
}

function startEdit(date) {
  editingDate = date;
  renderTable();
}

function cancelEdit() {
  editingDate = null;
  renderTable();
}

async function saveEdit(date) {
  const url = getScriptUrl();
  if (!url) { showToast("กรุณาตั้งค่า Script URL ก่อน"); return; }

  const row = currentRows.find(r => r.date === date);
  if (!row) return;

  const newAchieved = Number(document.getElementById("edit-achieved").value) || 0;
  const newInvest = Number(document.getElementById("edit-invest").value) || 0;
  const achievedDelta = newAchieved - (Number(row.achieved) || 0);
  const investDelta = newInvest - (Number(row.investment) || 0);

  try {
    await fetch(url, {
      method: "POST",
      body: JSON.stringify({
        date,
        target: row.target || getDailyTarget(),
        achieved: achievedDelta,
        investment: investDelta
      })
    });
    showToast("แก้ไขแล้ว ✅");
    loadMonth();
  } catch (err) {
    showToast("แก้ไขไม่สำเร็จ ลองใหม่อีกครั้ง");
  }
}

function renderTable() {
  const rows = [...currentRows].sort((a, b) => new Date(a.date) - new Date(b.date));
  const body = document.getElementById("tableBody");
  body.innerHTML = "";
  let total = 0, pctSum = 0, investTotal = 0;

  rows.forEach(r => {
    const pct = Number(r.percent) || 0;
    const color = percentColor(pct);
    total += Number(r.achieved) || 0;
    investTotal += Number(r.investment) || 0;
    pctSum += pct;

    const tr = document.createElement("tr");

    if (editingDate === r.date) {
      tr.classList.add("row-edit");
      tr.innerHTML = `
        <td>${r.date}</td>
        <td colspan="2">
          <input type="number" id="edit-achieved" value="${r.achieved}" placeholder="ยอดที่ทำได้">
          <input type="number" id="edit-invest" value="${r.investment}" placeholder="ยอดลงทุน">
          <div class="actions">
            <button style="background:var(--green);" onclick="saveEdit('${r.date}')">✔ บันทึก</button>
            <button class="secondary" onclick="cancelEdit()">ยกเลิก</button>
          </div>
        </td>
      `;
    } else {
      const investLine = Number(r.investment) ? `<div class="invest-line">ลงทุน: ฿${Number(r.investment).toLocaleString()}</div>` : "";
      tr.innerHTML = `
        <td>${r.date} <span class="edit-btn" onclick="startEdit('${r.date}')">✏️</span></td>
        <td>
          ฿${Number(r.achieved).toLocaleString()} / ฿${Number(r.target).toLocaleString()}
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(Math.max(pct,0),100)}%; background:${color}"></div></div>
          ${investLine}
        </td>
        <td style="color:${color}; font-weight:700;">${pct}%</td>
      `;
    }
    body.appendChild(tr);
  });

  document.getElementById("sumDays").textContent = rows.length;
  document.getElementById("sumTotal").textContent = total.toLocaleString();
  document.getElementById("sumAvgPct").textContent = rows.length ? Math.round(pctSum / rows.length) + "%" : "0%";
  document.getElementById("sumInvest").textContent = investTotal.toLocaleString();
}

initSettingsFields();
loadMonth();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
